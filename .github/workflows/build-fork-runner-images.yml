name: Build and publish fork-owned CI runner images

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: fork-runner-image-build-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/marlucool/mesh-llm-ci-runner
  RUNNER_IMAGES_SHA: 6c220ce1ed39d57c3fd67d60ee9554f83f0cf2e2

jobs:
  build:
    if: github.repository == 'marlucool/mesh-llm'
    name: Build ${{ matrix.image_id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - image_id: public-cpu
            dockerfile: Dockerfile
            backend: cpu
            cuda_series: none
            rocm_version: none
            platforms: linux/amd64,linux/arm64
          - image_id: public-web
            dockerfile: Dockerfile
            backend: web
            cuda_series: none
            rocm_version: none
            platforms: linux/amd64
          - image_id: public-cuda12
            dockerfile: Dockerfile
            backend: cuda
            cuda_series: 12-9
            rocm_version: none
            platforms: linux/amd64,linux/arm64
          - image_id: public-cuda13
            dockerfile: Dockerfile
            backend: cuda
            cuda_series: 13-1
            rocm_version: none
            platforms: linux/amd64,linux/arm64
          - image_id: public-rocm-ci
            dockerfile: Dockerfile
            backend: rocm
            cuda_series: none
            rocm_version: 7.0
            platforms: linux/amd64
          - image_id: public-rocm-release
            dockerfile: Dockerfile
            backend: rocm
            cuda_series: none
            rocm_version: 7.2.3
            platforms: linux/amd64
          - image_id: public-vulkan
            dockerfile: Dockerfile
            backend: vulkan
            cuda_series: none
            rocm_version: none
            platforms: linux/amd64,linux/arm64
          - image_id: public-ui
            dockerfile: Dockerfile.ui
            backend: ui
            cuda_series: none
            rocm_version: none
            platforms: linux/amd64
          - image_id: public-browser
            dockerfile: Dockerfile.ui
            backend: browser
            cuda_series: none
            rocm_version: none
            platforms: linux/amd64
    steps:
      - name: Checkout fork workflow revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Checkout trusted MeshLLM manifests from main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: marlucool/mesh-llm
          ref: main
          path: _mesh-source
          persist-credentials: false

      - name: Checkout pinned runner image recipes
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Mesh-LLM/mesh-llm-runner-images
          ref: ${{ env.RUNNER_IMAGES_SHA }}
          path: _runner-images
          persist-credentials: false

      - name: Install Rust for manifest discovery
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-20

      - name: Capture immutable source identities and manifests
        id: source
        shell: bash
        run: |
          set -euo pipefail
          mesh_sha="$(git -C _mesh-source rev-parse HEAD)"
          images_sha="$(git -C _runner-images rev-parse HEAD)"
          [[ "$images_sha" == "$RUNNER_IMAGES_SHA" ]]
          echo "mesh_sha=$mesh_sha" >> "$GITHUB_OUTPUT"
          echo "images_sha=$images_sha" >> "$GITHUB_OUTPUT"
          (
            cd _runner-images
            scripts/prepare-build-context.sh "$GITHUB_WORKSPACE/_mesh-source"
          )
          test -s _runner-images/build-context/manifests/public/manifest-index.json
          echo "MeshLLM source: $mesh_sha" >> "$GITHUB_STEP_SUMMARY"
          echo "Runner-image source: $images_sha" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up QEMU for multi-architecture images
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to fork-owned GitHub Container Registry package
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish immutable candidate
        id: build
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: _runner-images
          file: _runner-images/${{ matrix.dockerfile }}
          target: public
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ env.IMAGE }}:${{ matrix.image_id }}-bootstrap-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/marlucool/mesh-llm
            org.opencontainers.image.description=Fork-owned MeshLLM CI runner image (${{ matrix.image_id }})
          build-args: |
            BACKEND=${{ matrix.backend }}
            RUNNER_ENVIRONMENT=public
            MESH_LLM_REVISION=${{ steps.source.outputs.mesh_sha }}
            RUNNER_IMAGES_REVISION=${{ steps.source.outputs.images_sha }}
            VERIFIER_REVISION=${{ steps.source.outputs.images_sha }}
            CUDA_SERIES=${{ matrix.cuda_series }}
            ROCM_VERSION=${{ matrix.rocm_version }}
          provenance: false
          sbom: false

      - name: Record image digest
        shell: bash
        env:
          IMAGE: ${{ env.IMAGE }}
          IMAGE_ID: ${{ matrix.image_id }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_TAG: ${{ env.IMAGE }}:${{ matrix.image_id }}-bootstrap-${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "Buildx did not return an immutable image digest" >&2
            exit 1
          }
          printf '{"image_id":"%s","image":"%s","tag":"%s","digest":"%s"}\n' \
            "$IMAGE_ID" "$IMAGE" "$IMAGE_TAG" "$IMAGE_DIGEST" > "$RUNNER_TEMP/$IMAGE_ID.json"
          {
            echo "## $IMAGE_ID"
            echo
            echo "`$IMAGE@$IMAGE_DIGEST`"
            echo
            echo "Temporary bootstrap tag: `$IMAGE_TAG`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload digest receipt
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: runner-image-digest-${{ matrix.image_id }}
          path: ${{ runner.temp }}/${{ matrix.image_id }}.json
          if-no-files-found: error
          retention-days: 14
