name: Sync with Mesh-LLM upstream

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    name: Merge upstream main
    runs-on: ubuntu-24.04
    steps:
      - name: Check out fork
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Sync fork main
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git fetch https://github.com/Mesh-LLM/mesh-llm.git main:refs/remotes/upstream/main
          git checkout main
          git reset --hard origin/main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Fork main already contains upstream main."
            exit 0
          fi

          if ! git merge --no-edit --no-ff upstream/main; then
            git merge --abort || true
            echo "::error::Upstream MeshLLM changes conflict with fork-only changes."
            echo "main was left untouched. Resolve the conflict in a dedicated sync PR, then rerun this workflow."
            exit 1
          fi

          git push origin main
          echo "Synced fork main with Mesh-LLM upstream."
