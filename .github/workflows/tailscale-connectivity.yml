name: Tailscale connectivity

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  connectivity:
    name: Private tailnet connectivity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Tailscale GitHub Action v4.1.3, immutable release commit.
      - name: Connect to Tailscale
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:mesh-llm-ci

      - name: Verify Tailscale state
        run: |
          tailscale status
          tailscale ip -4

      - name: Verify MeshLLM peer connectivity
        if: ${{ vars.MESH_LLM_TAILSCALE_PEER != '' }}
        run: |
          tailscale ping "${{ vars.MESH_LLM_TAILSCALE_PEER }}"

      - name: Verify MeshLLM API reachability
        if: ${{ vars.MESH_LLM_TAILSCALE_API_URL != '' }}
        run: |
          API_URL="${{ vars.MESH_LLM_TAILSCALE_API_URL }}"
          API_URL="${API_URL%/v1}"
          curl --fail --silent --show-error --connect-timeout 10 --max-time 20 \
            "${API_URL}/v1/models"
